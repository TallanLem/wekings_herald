name: Herald (Chain)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: herald-bot
  cancel-in-progress: false

jobs:
  run-herald:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Write cookies to file
        run: |
          cat <<'EOF' > herald_playwekings.ru.json
          ${{ secrets.COOKIES_JSON }}
          EOF

      - name: Run Herald bot and persist state each poll
        env:
          BOT_TOKEN:    ${{ secrets.BOT_TOKEN }}
          CHAT_IDS:     ${{ secrets.CHAT_IDS }}
          COOKIES_FILE: herald_playwekings.ru.json
          STATE_FILE:   notify_state.json
          LOOP_SECONDS: "0"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          deadline=$((SECONDS + 21000))
          last_failed=0
          while true; do
            if python bot.py; then
              last_failed=0
            else
              last_failed=1
              echo "::error::Herald poll failed; state is still being saved."
            fi

            if [[ -n "$(git status --porcelain notify_state.json)" ]]; then
              git add notify_state.json
              git commit -m "Update notify_state.json [skip ci]"
            fi

            # Retry pending commits even when the state file did not change again.
            if [[ "$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" -gt 0 ]]; then
              if ! git push; then
                echo "::warning::Failed to push notify_state.json; will retry on next poll."
                last_failed=1
              fi
            fi

            if (( SECONDS >= deadline )); then
              break
            fi
            sleep 60
          done
          if (( last_failed != 0 )); then
            echo "::error::The final Herald poll or state push failed."
            exit 1
          fi

      - name: Continue chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${GITHUB_REF_NAME:-main}"
          payload=$(printf '{"ref":"%s"}' "$ref")

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/herald.yml/dispatches" \
            -d "$payload"
